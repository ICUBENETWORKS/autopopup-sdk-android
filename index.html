<h1>AutoPopup SDK Maven 저장소</h1>
<p>Android 호스트 앱에서 토큰 없이 설치할 수 있는 Maven 저장소입니다. 사용 방법은 <a href="https://github.com/ICUBENETWORKS/autopopup-sdk-android">autopopup-sdk-android</a>를 참고하세요.</p>
<pre><code>maven { url = uri("https://icubenetworks.github.io/autopopup-sdk-android/maven") }

implementation 'com.icubeon:autopopup-sdk:1.1.0'</code></pre>
